name: Build Sqile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org com.sqile .
          fi

      - name: Configure Android SDK
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((p for p in candidates if p.exists()), None)

          if gradle is None:
              raise SystemExit("Gradle app file not found")

          text = gradle.read_text()
          pattern = r'compileSdk\s*(?:=\s*)?(?:flutter\.compileSdkVersion|[0-9]+)'
          updated, count = re.subn(pattern, 'compileSdk = 36' if gradle.suffix == '.kts' else 'compileSdk 36', text, count=1)

          if count == 0:
              raise SystemExit("compileSdk setting not found in " + str(gradle))

          gradle.write_text(updated)
          print("Updated compileSdk to 36 in", gradle)
          PYCODE

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Sqile-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
