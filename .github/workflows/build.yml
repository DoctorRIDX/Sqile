name: Build Sqile Protax APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project if needed
        run: |
          if [ ! -f android/gradlew ]; then flutter create --platforms=android --org com.sqile .; fi
      - name: Configure Android WebView and SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit('Android app Gradle file not found')
          s = gradle.read_text()
          if gradle.suffix == '.kts':
              s, n = re.subn(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', s, count=1)
          else:
              s, n = re.subn(r'compileSdk\s+[^\n]+', 'compileSdk 36', s, count=1)
          if n == 0:
              raise SystemExit('Could not update compileSdk in ' + str(gradle))
          gradle.write_text(s)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          ms = manifest.read_text()
          if 'android.permission.INTERNET' not in ms:
              ms = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET" />', ms, count=1)
          if 'android:usesCleartextTraffic=' not in ms:
              ms = re.sub(r'(<application\b)', r'\1 android:usesCleartextTraffic="true"', ms, count=1)
          ms = re.sub(r'android:label="[^"]*"', 'android:label="Sqile Protax"', ms, count=1)
          manifest.write_text(ms)
          print('Configured', gradle, 'with compileSdk 36 and app label Sqile Protax')
          PY
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Install dependencies and app icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Sqile-Protax-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
