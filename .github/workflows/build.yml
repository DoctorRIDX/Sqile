name: Build Sqile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org com.sqile .
          fi

      - name: Set and verify compileSdk
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            FILE=android/app/build.gradle.kts
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*(flutter\.compileSdkVersion|[0-9]+)/compileSdk = 36/' "$FILE"
          elif [ -f android/app/build.gradle ]; then
            FILE=android/app/build.gradle
            sed -i -E 's/compileSdk[[:space:]]+(flutter\.compileSdkVersion|[0-9]+)/compileSdk 36/' "$FILE"
          else
            echo "ERROR: Gradle app file not found"
            exit 1
          fi

          grep -n 'compileSdk' "$FILE"
          grep -Eq 'compileSdk[[:space:]]*(=[[:space:]]*36|36)([^0-9]|$)' "$FILE" || {
            echo "ERROR: compileSdk 36 was not configured"
            exit 1
          }

      - name: Install Android API 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Sqile-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
