name: Build Sqile APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold if absent
        run: |
          if [ ! -f android/gradlew ]; then flutter create --platforms=android --org com.sqile .; fi
      - name: Install dependencies and icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Sqile-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
