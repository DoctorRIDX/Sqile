name: sqile
description: Sqile security dashboard and APK permission scanner.
publish_to: none
version: 2.0.0+2
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  shared_preferences: ^2.3.5
  network_info_plus: ^6.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.png
  adaptive_icon_background: '#100D18'
  adaptive_icon_foreground: assets/logo.png
